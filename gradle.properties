org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all

android.useAndroidX=true
android.nonTransitiveRClass=true
# compileSdk 37 is newer than what some AGP patch releases advertise; silence the warning.
android.suppressUnsupportedCompileSdk=37,37.0,37.2

# AGP 9 enables built-in Kotlin by default, which conflicts with the standalone
# Kotlin Gradle plugin. Opt out so this project keeps using an explicit Kotlin
# version (kept in sync with the Compose compiler plugin in build.gradle).
# See https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
