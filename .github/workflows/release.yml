name: Release

# 手动触发（Actions 页面 → Run workflow），也可以推 v* 标签触发。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v1.0.0（留空则用 v<versionName>）'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 注意：这里故意不加 android-actions/setup-android@v3。
      # 它内部会跑 `sdkmanager tools`，而 tools 包早已从 SDK 仓库下架，
      # 这个 action 必然失败（Release #1 就是栽在这）。ubuntu runner 自带 SDK。
      #
      # compileSdk 是 android-37.2（较新的平台），稳定通道装不到时走 canary；
      # 两条都失败也不直接挂，交给 AGP 自己补下载（真失败会在构建步骤报出来）。
      - name: Install SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          echo "sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          PKGS=("platform-tools" "build-tools;37.0.0" "platforms;android-37.2")
          "$SDKMANAGER" --install "${PKGS[@]}" \
            || "$SDKMANAGER" --channel=3 --install "${PKGS[@]}" \
            || echo "::warning::SDK 平台没装全，交给 AGP 自动下载"

      - name: Read version from build.gradle
        id: ver
        run: |
          name=$(grep -oP "versionName\s+[\"']\K[^\"']+" app/build.gradle)
          code=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "版本：$name ($code)"

      # 不跑 lint：QUERY_ALL_PACKAGES 是刻意申请的，lint 会拦（侧载应用不关心 Play 政策）。
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain -x lint

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 secret：SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="xiaomi-eu-toolkit-${{ steps.ver.outputs.name }}.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          fi
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:STORE_PASS \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass env:KEY_PASS \
            --out "$OUT" "$UNSIGNED"
          echo "--- 签名校验 ---"
          "$APKSIGNER" verify --print-certs "$OUT" | head -6
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('v{0}', steps.ver.outputs.name) }}
          name: ${{ inputs.tag || format('v{0}', steps.ver.outputs.name) }}
          files: ${{ env.OUT }}
          body: |
            对应源码：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
