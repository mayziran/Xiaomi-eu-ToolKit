name: Build debug APK

# 只在手动触发时运行：仓库页面 -> Actions -> 左侧选 "Build debug APK" -> Run workflow。
# 不同步代码就编译，避免每次 push 都跑一遍。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 是 37.2，对应 platform android-37.2；构建工具用 37.0.0。
      # 这个平台比较新，稳定通道装不到时改走 canary 通道（--channel=3）；
      # 两条都失败也不直接挂，交给 AGP 自己补下载（真失败会在构建步骤报出来）。
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          PKGS=("platform-tools" "build-tools;37.0.0" "platforms;android-37.2")
          "$SDKMANAGER" --install "${PKGS[@]}" \
            || "$SDKMANAGER" --channel=3 --install "${PKGS[@]}" \
            || echo "::warning::SDK 平台没装全，交给 AGP 自动下载"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Summarize
        if: success()
        run: |
          echo "### Debug APK 构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-eu-ToolKit-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
