name: Build debug APK

# 只在手动触发时运行：仓库页面 -> Actions -> 左侧选 "Build debug APK" -> Run workflow。
# 不同步代码就编译，避免每次 push 都跑一遍。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 是 37.2，对应 platform android-37.2；构建工具用 37.0.0。
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Summarize
        if: success()
        run: |
          echo "### Debug APK 构建成功" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/*.apk >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-eu-ToolKit-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
