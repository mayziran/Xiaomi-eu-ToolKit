plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.xiaomieu.toolkit'
    // libxposed API 102 needs API 37+; Compose 1.13 needs 37.1+, so compile against 37.2.
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.xiaomieu.toolkit"
        minSdk 28
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    // Modern Xposed API (libxposed, API 102). Supplied by the framework at runtime,
    // so it must not be bundled into the APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Service library: ships the XposedProvider the framework binds to,
    // plus XposedServiceHelper / RemotePreferences.
    implementation 'io.github.libxposed:service:102.0.0'

    // Root shell / root file IO.
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // Compose UI.
    implementation platform('androidx.compose:compose-bom-alpha:2026.09.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.core:core-ktx:1.19.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
