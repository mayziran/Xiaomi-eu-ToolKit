plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.xiaomieu.toolkit'
    // libxposed API 102 needs API 37+; Compose 1.13 needs 37.1+, so compile against 37.2.
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "com.xiaomieu.toolkit"
        // libxposed 的 PackageLoadedParam.defaultClassLoader 标了 @RequiresApi(29)，
        // 所以最低只能到 29（Android 9 上模块会加载失败）。
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName "1.0.1"
    }

    // 发布签名：从项目根目录的 keystore.properties 读（该文件不进仓库，见 .gitignore）。
    // 本地放一份，assembleRelease 就产出和 GitHub Actions 同一个签名的包；
    // 没放也不影响编译，只是 release 退回产出未签名包。
    // 注意用 UTF-8 读 —— Properties 默认按 ISO-8859-1 解码，路径里的中文会乱码。
    def ksFile = rootProject.file('keystore.properties')
    def ksProps = new Properties()
    if (ksFile.exists()) {
        ksFile.withReader('UTF-8') { ksProps.load(it) }
    }
    def hasReleaseSigning = ksFile.exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                // 相对路径按项目根目录解析，避免路径里出现中文
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }
}

dependencies {
    // Modern Xposed API (libxposed, API 102). Supplied by the framework at runtime,
    // so it must not be bundled into the APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Service library: ships the XposedProvider the framework binds to,
    // plus XposedServiceHelper / RemotePreferences.
    implementation 'io.github.libxposed:service:102.0.0'

    // Root shell / root file IO.
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    // Compose UI.
    implementation platform('androidx.compose:compose-bom-alpha:2026.09.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.core:core-ktx:1.19.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
}
