// Top-level build file. Declares the plugins shared by all modules.
//
// Versions are aligned with the AGP 9.4.1 toolchain used by the reference
// projects in this workspace (MiPushFramework / MIUIRegionSpoof).
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.5.0-Beta1' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.5.0-Beta1' apply false
}
